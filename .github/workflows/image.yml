name: Publish Docker image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run release verification
        run: |
          npm run typecheck
          npm test
          npm run validate:examples
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate tags, labels, and OCI annotations
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: mateopedersen/betacalendars-print-renderer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=BetaCalendars Print Renderer
            org.opencontainers.image.description=Deterministic printable calendar renderer for SVG, PDF and JSON.
            org.opencontainers.image.url=https://www.betacalendars.com/
            org.opencontainers.image.source=https://github.com/mateopedersen/betacalendars-print-renderer
            org.opencontainers.image.documentation=https://github.com/mateopedersen/betacalendars-print-renderer/tree/main/docs
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=BetaCalendars Print Renderer
            org.opencontainers.image.description=Deterministic printable calendar renderer for SVG, PDF and JSON.
            org.opencontainers.image.url=https://www.betacalendars.com/
            org.opencontainers.image.source=https://github.com/mateopedersen/betacalendars-print-renderer
            org.opencontainers.image.licenses=MIT
      - name: Build and publish multi-platform image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image digest
        run: echo "Published index digest ${{ steps.image.outputs.digest }}"
